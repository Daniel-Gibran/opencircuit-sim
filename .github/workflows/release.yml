name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev libgl1-mesa-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empaquetar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NAME="opencircuit-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/opencircuit" "dist/$NAME/"
          cp -r assets docs README.md LICENSE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "opencircuit-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/opencircuit.exe" "dist/$name/"
          Copy-Item -Recurse assets,docs,README.md,LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
